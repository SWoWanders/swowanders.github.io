<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Two Minds, One Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1424;--panel:#271b31;--line:#3a2a47;--ink:#f6ebdc;--dim:#b9a8c4;--accent:#ffb35c;--pip:#ff8a5c;--moss:#5cc8b4}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Nunito,system-ui,sans-serif}
#app{display:grid;grid-template-rows:56vh minmax(0,1fr);height:100dvh}
@media(min-width:900px){#app{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) 380px}}
#stage{position:relative;overflow:hidden;background:#140d19}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);width:max-content;max-width:min(240px,62vw);background:#fff8ee;color:#2a1d2e;padding:8px 12px;border-radius:14px;font-weight:700;font-size:14px;line-height:1.3;box-shadow:0 4px 14px #0006;transition:opacity .3s;opacity:0}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff8ee;border-bottom:0}
.bubble.on{opacity:1}
.bubble.thinking{font-size:18px;letter-spacing:3px;padding:2px 14px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.tag{position:absolute;transform:translate(-50%,0);font:600 12px Fredoka,sans-serif;padding:1px 8px;border-radius:9px;color:#1d1424;white-space:nowrap;opacity:.92}
#title{position:absolute;left:12px;top:10px;font:600 20px Fredoka,sans-serif;text-shadow:0 2px 8px #000a;pointer-events:none}
#title small{display:block;font:600 12px Nunito,sans-serif;color:var(--dim)}
#panel{background:var(--panel);border-top:1px solid var(--line);overflow-y:auto;padding:14px 14px 70px;display:flex;flex-direction:column;gap:12px}
@media(min-width:900px){#panel{border-top:0;border-left:1px solid var(--line)}}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.pick{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13px}
select,input,textarea,button{font:inherit;font-size:16px;color:var(--ink);background:#1d1424;border:1px solid var(--line);border-radius:10px;padding:10px}
select{width:100%}
button{min-height:44px;cursor:pointer;font-weight:700}
button.primary{background:var(--accent);color:#2a1d2e;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}.btns button{flex:1 1 auto}
#prog{height:8px;background:#1d1424;border-radius:5px;overflow:hidden;display:none}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#status{font-size:13px;color:var(--dim);margin:0}
#log{display:flex;flex-direction:column;gap:8px}
.entry{background:#1d1424;border-radius:10px;padding:8px 10px;border-left:4px solid var(--c,var(--accent))}
.entry b{color:var(--c,var(--accent))}.entry .m{font-size:11px;color:var(--dim)}.entry .act{font-size:12px;color:var(--dim)}
details{background:#1d1424;border-radius:10px;padding:8px 10px}
summary{cursor:pointer;font-weight:700;min-height:28px}
details label{display:block;font-weight:700;font-size:13px;margin-top:8px}
textarea{width:100%;min-height:64px;resize:vertical;margin-top:4px}
form.nudge{display:flex;gap:8px}form.nudge input{flex:1}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(20px);background:#fff8ee;color:#2a1d2e;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;max-width:90vw;z-index:9;box-shadow:0 6px 20px #0008;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--dim);margin:4px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script type="importmap">

</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bubbles"></div>
    <div id="title">Two Minds, One Room<small>Two free AI models share a cozy little room</small></div>
  </div>
  <aside id="panel">
    <div class="row">
      <label class="pick"><span style="color:var(--pip)">Pip's mind</span><select id="mA"><option value="">Loading…</option></select></label>
      <label class="pick"><span style="color:var(--moss)">Moss's mind</span><select id="mB"><option value="">Loading…</option></select></label>
    </div>
    <div class="btns">
      <button class="primary" id="go" disabled>Start with AI</button>
      <button id="demo">Scripted demo</button>
      <button id="pause" disabled>Pause</button>
    </div>
    <div id="prog"><i></i></div>
    <p id="status">Starting up…</p>
    <form class="nudge" id="nudge">
      <input id="ev" placeholder="Make something happen… (a cat walks in)" maxlength="120" autocomplete="off" aria-label="Event">
      <button>Send</button>
    </form>
    <label class="pick">Pace
      <select id="spd"><option value="6000">Calm</option><option value="3000" selected>Normal</option><option value="1000">Quick</option></select>
    </label>
    <details>
      <summary>Personalities</summary>
      <label>Pip<textarea id="pA"></textarea></label>
      <label>Moss<textarea id="pB"></textarea></label>
      <p class="hint">Changes apply from the next turn.</p>
    </details>
    <div id="log"></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const toastEl = $('#toast'); let toastT;
function toast(msg, ms = 3200) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('tmor_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

};
const statusEl = $('#status'), progEl = $('#prog'), logEl = $('#log');
const status = t => statusEl.textContent = t;
const bar = p => { progEl.style.display = 'block'; progEl.firstElementChild.style.width = Math.round((p || 0) * 100) + '%'; };

/* ---------- Scene ---------- */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x140d19);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100); camera.position.set(7.5, 6.5, 9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 1, -0.8); controls.enableDamping = true; controls.enablePan = false;
controls.maxPolarAngle = 1.45; controls.minDistance = 5; controls.maxDistance = 17;
controls.minAzimuthAngle = -0.15; controls.maxAzimuthAngle = 1.7;
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
const ro = new ResizeObserver(resize); ro.observe(stage);

scene.add(new THREE.HemisphereLight(0xffe2c4, 0x2a1838, 1.1));
const key = new THREE.DirectionalLight(0xffd9b0, 1.4); key.position.set(5, 9, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); Object.assign(key.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7 }); key.shadow.bias = -0.0005;
scene.add(key);

const mats = {};
function mat(c, o = {}) { const k = c + JSON.stringify(o); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial({ color: c, roughness: .8, ...o })); }
function box(w, h, d, c, x, y, z, shadow = true) {

}

  m.position.set(x, y + h / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}

// floor, walls, rug
box(10, 0.1, 10, 0x7a4b31, 0, -0.1, 0, false);
for (let i = -4.5; i <= 4.5; i += 1) box(0.02, 0.005, 10, 0x6a3f28, i, 0, 0, false);
box(10, 4, 0.2, 0xd8b58a, 0, 0, -5.1, false);
box(0.2, 4, 10, 0xcda77c, -5.1, 0, 0, false);
box(10, 0.22, 0.05, 0x5a3524, 0, 0, -4.98, false);
box(0.05, 0.22, 10, 0x5a3524, -4.98, 0, 0, false);
const rug = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.02, 48), mat(0xb8475a)); rug.position.set(1.5, 0.01, 1); rug.receiveShadow = true; scene.add(rug);
const rug2 = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.02, 48), mat(0xe8a33d)); rug2.position.set(1.5, 0.02, 1); rug2.receiveShadow = true; scene.add(rug2);

// window with night sky
function skyTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 180; const g = c.getContext('2d');

  for (let i = 0; i < 80; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * .7 + .3})`; g.fillRect(Math.random() * 256, Math.random() * 120, 1.5, 1.5); }
  g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(195, 48, 17, 0, 7); g.fill();
  g.fillStyle = '#17123a'; for (let x = 0; x < 256; x += 21) { const h = 18 + Math.random() * 42; g.fillRect(x, 180 - h, 19, h); }
  g.fillStyle = '#ffd36b'; for (let i = 0; i < 25; i++) g.fillRect(Math.random() * 256, 140 + Math.random() * 36, 2, 3);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const win = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.5), new THREE.MeshBasicMaterial({ map: skyTex() })); win.position.set(2.5, 2.2, -4.98); scene.add(win);
box(2.4, 0.1, 0.1, 0xf3e3c8, 2.5, 2.95, -4.95, false); box(2.6, 0.12, 0.25, 0xf3e3c8, 2.5, 1.33, -4.88, false);
box(0.1, 1.6, 0.1, 0xf3e3c8, 1.35, 1.4, -4.95, false); box(0.1, 1.6, 0.1, 0xf3e3c8, 3.65, 1.4, -4.95, false); box(0.05, 1.5, 0.05, 0xf3e3c8, 2.5, 1.45, -4.96, false);
const winLight = new THREE.PointLight(0x8fb0ff, 3, 7, 1); winLight.position.set(2.5, 2, -4); scene.add(winLight);

// picture over couch
box(1.4, 0.9, 0.05, 0x3a2a47, -1.2, 2.0, -4.97, false);
const art = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7), new THREE.MeshStandardMaterial({ color: 0xff8a5c, emissive: 0x6a2a10, emissiveIntensity: .6 })); art.position.set(-1.2, 2.45, -4.94); scene.add(art);
const sun = new THREE.Mesh(new THREE.CircleGeometry(0.16, 24), new THREE.MeshBasicMaterial({ color: 0xffe07a })); sun.position.set(-1.05, 2.4, -4.93); scene.add(sun);

// couch
box(3, 0.45, 1.1, 0x6b3b8f, -1.2, 0, -4.2); box(3, 1.0, 0.3, 0x5a2f7a, -1.2, 0, -4.8);
box(0.3, 0.7, 1.1, 0x5a2f7a, -2.85, 0, -4.2); box(0.3, 0.7, 1.1, 0x5a2f7a, 0.45, 0, -4.2);
box(1.35, 0.14, 0.85, 0x7d4aa3, -1.9, 0.45, -4.1); box(1.35, 0.14, 0.85, 0x7d4aa3, -0.5, 0.45, -4.1);
// coffee table + mug
box(1.6, 0.08, 0.8, 0x9c6a3f, -1.2, 0.4, -2.2);
for (const [dx, dz] of [[-.7, -.32], [.7, -.32], [-.7, .32], [.7, .32]]) box(0.07, 0.4, 0.07, 0x6a3f25, -1.2 + dx, 0, -2.2 + dz);
cyl(0.07, 0.07, 0.14, 0xfff1dc, -0.9, 0.48, -2.1);
// bookshelf
box(0.06, 2.6, 2.2, 0x4a2a1c, -4.97, 0, -0.5);
box(0.5, 2.6, 0.06, 0x5a3524, -4.75, 0, -1.57); box(0.5, 2.6, 0.06, 0x5a3524, -4.75, 0, 0.57);
const bookCols = [0xb8475a, 0xe8a33d, 0x3f7fbf, 0x5cc8b4, 0x8c5ab8, 0xf3e3c8, 0x4f8f4a, 0xd96c3b];
[0, 0.65, 1.3, 1.95].forEach((h, s) => {
  box(0.5, 0.05, 2.2, 0x5a3524, -4.75, h, -0.5);
  let z = -1.5; while (z < 0.45) { const w = 0.07 + Math.random() * 0.07, bh = 0.32 + Math.random() * 0.22; if (Math.random() > .12) box(0.34, bh, w, bookCols[(Math.random() * 8) | 0], -4.78, h + 0.05, z + w / 2); z += w + 0.01; }
});
box(0.5, 0.05, 2.2, 0x5a3524, -4.75, 2.55, -0.5);
// plant
cyl(0.35, 0.26, 0.6, 0xc0623a, -4.3, 0, -4.3);
const leafM = mat(0x3f8f4a, { roughness: .6 });
for (let i = 0; i < 9; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), leafM); const a = i * 0.7; l.position.set(-4.3 + Math.cos(a) * 0.3, 0.8 + i * 0.12, -4.3 + Math.sin(a) * 0.3); l.scale.set(1, 0.6, 1); l.castShadow = true; scene.add(l); }
// floor lamp
cyl(0.25, 0.3, 0.06, 0x2a1d2e, 0.9, 0, -4.4); cyl(0.025, 0.025, 1.6, 0x2a1d2e, 0.9, 0.06, -4.4);
const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.38, 0.45, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0xffd08a, emissive: 0xffa040, emissiveIntensity: 1.2, side: THREE.DoubleSide }));
shade.position.set(0.9, 1.85, -4.4); scene.add(shade);
const lampLight = new THREE.PointLight(0xffa850, 4, 8, 1); lampLight.position.set(0.9, 1.75, -4.3); scene.add(lampLight);
// radio
box(1.2, 0.8, 0.6, 0x6a3f25, 4.2, 0, -4.5); box(0.8, 0.45, 0.3, 0xd9a35b, 4.2, 0.8, -4.5);
const grille = new THREE.Mesh(new THREE.CircleGeometry(0.14, 20), mat(0x3a2a1c)); grille.position.set(4.0, 1.02, -4.34); scene.add(grille);
const radioLed = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshStandardMaterial({ color: 0xff4040, emissive: 0xff2020, emissiveIntensity: 2 })); radioLed.position.set(4.45, 1.1, -4.34); scene.add(radioLed);
// armchair
box(1.1, 0.45, 1.1, 0x2f7a6b, 3.6, 0, 1.6); box(0.3, 1.0, 1.1, 0x24604f, 4.15, 0, 1.6);
box(1.1, 0.65, 0.22, 0x24604f, 3.6, 0, 1.0); box(1.1, 0.65, 0.22, 0x24604f, 3.6, 0, 2.2);
// door
box(0.1, 2.4, 1.3, 0xf3e3c8, -4.97, 0, 3, false); box(0.08, 2.25, 1.1, 0x8a4b2a, -4.93, 0, 3, false);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), mat(0xe8c060, { metalness: .8, roughness: .3 })); knob.position.set(-4.86, 1.05, 3.4); scene.add(knob);

/* ---------- Places ---------- */
const PLACES = [
  { key: 'couch', label: 'couch', alias: ['sofa'], pos: [-1.2, -4.0], look: [-1.2, 0], side: [1, 0], sit: 0.28 },
  { key: 'table', label: 'coffee table', alias: ['coffee', 'mug'], pos: [-1.2, -1.35], look: [-1.2, -2.2], side: [1, 0] },
  { key: 'bookshelf', label: 'bookshelf', alias: ['book', 'shelf'], pos: [-3.9, -0.5], look: [-5, -0.5], side: [0, 1] },
  { key: 'plant', label: 'plant', alias: ['fern', 'leaf'], pos: [-3.5, -3.2], look: [-4.3, -4.3], side: [0.7, -0.7] },
  { key: 'lamp', label: 'lamp', alias: ['light'], pos: [0.9, -3.4], look: [0.9, -4.4], side: [1, 0] },
  { key: 'window', label: 'window', alias: ['moon', 'sky', 'outside'], pos: [2.5, -4.0], look: [2.5, -5], side: [1, 0] },
  { key: 'radio', label: 'radio', alias: ['music', 'song'], pos: [4.0, -3.4], look: [4.2, -4.5], side: [1, 0] },
  { key: 'armchair', label: 'armchair', alias: ['chair'], pos: [3.5, 1.6], look: [0, 1.6], side: [0, 1], sit: 0.28 },
  { key: 'rug', label: 'rug', alias: ['middle', 'centre', 'center', 'floor'], pos: [1.5, 1.0], look: [8, 9], side: [1, 0], spread: 0.75 },
  { key: 'door', label: 'door', alias: ['exit'], pos: [-4.0, 3.0], look: [-5, 3], side: [0, 1] }
];
const ACTIONS = ['wave', 'dance', 'sit', 'think'];
const byKey = k => PLACES.find(p => p.key === k);
function findPlace(str) {
  const s = (str || '').toLowerCase(); if (!s) return null;
  return PLACES.find(p => s.includes(p.key)) || PLACES.find(p => p.alias.some(a => s.includes(a))) || null;

/* ---------- Characters ---------- */
function makeChar(hex, kind) {
  const g = new THREE.Group(); const m = mat(hex, { roughness: .55 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.5, 6, 16), m); body.position.y = 0.62; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16), m); head.position.y = 1.32; head.castShadow = true;
  const white = mat(0xffffff, { roughness: .3 }), black = mat(0x111111, { roughness: .3 });
  for (const s of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), white); e.position.set(0.11 * s, 0.04, 0.25); const p = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 8), black); p.position.z = 0.05; e.add(p); head.add(e); }
  const arms = [];
  for (const s of [-1, 1]) { const piv = new THREE.Group(); piv.position.set(0.36 * s, 0.95, 0); const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.3, 4, 8), m); a.position.y = -0.2; a.castShadow = true; piv.add(a); g.add(piv); arms.push(piv); }
  if (kind === 'antenna') {
    const st = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.3), black); st.position.y = 0.42; head.add(st);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffc400, emissiveIntensity: 1.5 })); b.position.y = 0.6; head.add(b);
  } else {
    const hm = mat(0x6b4a2b);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.04, 24), hm); brim.position.y = 0.2;
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.28, 20), hm); top.position.y = 0.36;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), mat(0x5fbf5a)); leaf.scale.set(1, 0.4, 1.8); leaf.position.set(0.22, 0.38, 0);
    brim.castShadow = top.castShadow = true; head.add(brim, top, leaf);

}
const DEF_A = 'a curious, excitable little robot who loves music, dancing and asking lots of questions';
const DEF_B = 'a calm, dry-humoured gardener spirit who loves plants, books, tea and quiet evenings';
const chars = [
  { i: 0, name: 'Pip', color: '#ff8a5c', kind: 'antenna', persona: store.get('pA', DEF_A), start: 'rug' },
  { i: 1, name: 'Moss', color: '#5cc8b4', kind: 'hat', persona: store.get('pB', DEF_B), start: 'bookshelf' }
];
const bubbles = $('#bubbles');
for (const c of chars) {
  Object.assign(c, makeChar(parseInt(c.color.slice(1), 16), c.kind));
  c.place = byKey(c.start); const p = spot(c, c.place);
  c.g.position.set(p.x, 0, p.z); c.yaw = Math.atan2(c.place.look[0] - p.x, c.place.look[1] - p.z); c.g.rotation.y = c.yaw;
  c.target = null; c.action = 'none'; c.pendingAct = null; c.actT = 0; c.baseY = 0; c.sitting = false;
  c.bub = document.createElement('div'); c.bub.className = 'bubble';
  c.tag = document.createElement('div'); c.tag.className = 'tag'; c.tag.style.background = c.color; c.tag.textContent = c.name;
  bubbles.append(c.tag, c.bub);
}
function spot(c, p) { const s = (p.spread || 0.5) * (c.i ? 1 : -1); return new THREE.Vector3(p.pos[0] + p.side[0] * s, 0, p.pos[1] + p.side[1] * s); }
function arrive(c) {
  const p = c.place, pos = c.g.position;
  c.yaw = Math.atan2(p.look[0] - pos.x, p.look[1] - pos.z);
  const act = c.pendingAct || 'none'; c.pendingAct = null;
  c.sitting = !!p.sit || act === 'sit';
  c.baseY = p.sit ? p.sit : (act === 'sit' ? -0.16 : 0);
  c.action = act; c.actT = act === 'none' ? 0 : 4.5;
}
const lerp = (a, b, k) => a + (b - a) * k;
function updateChar(c, dt, t) {
  const cur = c.g.position; let moving = false;
  if (c.target) {
    const dx = c.target.x - cur.x, dz = c.target.z - cur.z, d = Math.hypot(dx, dz);
    if (d > 0.04) { const st = Math.min(d, 1.5 * dt); cur.x += dx / d * st; cur.z += dz / d * st; c.yaw = Math.atan2(dx, dz); moving = true; }
    else { c.target = null; arrive(c); }
  }
  let bob = 0, aL = 0, aR = 0, zL = 0, zR = 0, tilt = 0;
  const act = c.actT > 0 ? c.action : 'none'; c.actT -= dt;
  if (moving) { bob = Math.abs(Math.sin(t * 10)) * 0.08; aL = Math.sin(t * 10) * 0.6; aR = -aL; }
  else if (act === 'dance') { bob = Math.abs(Math.sin(t * 8)) * 0.15; zL = -2.5 - Math.sin(t * 8) * 0.4; zR = 2.5 + Math.sin(t * 8) * 0.4; c.yaw += dt * 3; }
  else if (act === 'wave') { zR = 2.6 + Math.sin(t * 12) * 0.35; }
  else if (act === 'think') { tilt = 0.25; aR = -1.7; }
  else bob = Math.sin(t * 2 + c.i * 2) * 0.015;
  let diff = c.yaw - c.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
  c.g.rotation.y += diff * Math.min(1, dt * (act === 'dance' ? 30 : 8));
  const k = Math.min(1, dt * 8);
  c.arms[0].rotation.x = lerp(c.arms[0].rotation.x, aL, k); c.arms[1].rotation.x = lerp(c.arms[1].rotation.x, aR, k);
  c.arms[0].rotation.z = lerp(c.arms[0].rotation.z, zL, k); c.arms[1].rotation.z = lerp(c.arms[1].rotation.z, zR, k);
  c.head.rotation.z = lerp(c.head.rotation.z, tilt, k);
  c.curY = lerp(c.curY || 0, moving ? 0 : c.baseY, Math.min(1, dt * 6));

}
const v3 = new THREE.Vector3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const c of chars) {
    c.head.getWorldPosition(v3); v3.y += 0.6; v3.project(camera);
    c.bub.style.left = (v3.x * .5 + .5) * w + 'px'; c.bub.style.top = (-v3.y * .5 + .5) * h + 'px';
    c.g.getWorldPosition(v3); v3.y -= 0.15; v3.project(camera);
    c.tag.style.left = (v3.x * .5 + .5) * w + 'px'; c.tag.style.top = (-v3.y * .5 + .5) * h + 'px';
  }
}
function say(c, text) {
  clearTimeout(c.bubT); c.bub.classList.remove('thinking'); c.bub.textContent = text; c.bub.classList.add('on');
  c.bubT = setTimeout(() => c.bub.classList.remove('on'), 4000 + text.length * 60);
}
function thinking(c, on) {
  if (on) { clearTimeout(c.bubT); c.bub.textContent = '• • •'; c.bub.classList.add('on', 'thinking'); }
  else c.bub.classList.remove('thinking');
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  for (const c of chars) updateChar(c, dt, t);
  radioLed.material.emissiveIntensity = Math.sin(t * 4) > 0 ? 2.5 : 0.3;
  lampLight.intensity = 4 + Math.sin(t * 13) * 0.08;
  controls.update(); renderer.render(scene, camera); placeLabels();
});

/* ---------- Brains ---------- */
const transcript = [], events = [];
const short = id => (id || '').replace(/-q\d.*$/i, '').replace(/-MLC$/i, '');
function buildMsgs(c, o) {
  const names = PLACES.map(p => p.key).join(', ');
  const sys = `You are ${c.name}, ${c.persona}. You live in a small cozy room with ${o.name}. Each turn you choose ONE place to go, ONE action, and say ONE short sentence (under 20 words) to ${o.name}.
Reply in exactly this format and nothing else:
GO: <place>
DO: <action>
SAY: <sentence>
Places: ${names}, stay.
Actions: wave, dance, sit, think, none.
Example:
GO: window
DO: think
SAY: Look, ${o.name}, I think it's starting to snow.`;
  const last = transcript.slice(-6).map(l => `${l.who}: ${l.text}`).join('\n') || '(nobody has spoken yet)';
  const ev = events.filter(e => e.left > 0).map(e => { e.left--; return e.text; }).join(' ');
  for (let i = events.length - 1; i >= 0; i--) if (events[i].left <= 0) events.splice(i, 1);
  const user = `You are at the ${c.place.label}${c.sitting ? ' (sitting)' : ''}. ${o.name} is at the ${o.place.label}.
Recent conversation:
${last}
${ev ? 'Something just happened in the room: ' + ev + '\n' : ''}Your turn, ${c.name}. Answer with the GO, DO and SAY lines.`;
  return [{ role: 'system', content: sys }, { role: 'user', content: user }];
}
function cleanSay(s, c, o) {
  s = (s || '').split('\n').map(x => x.trim()).find(x => x && !/^(go|do)\s*[:\-]/i.test(x)) || '';
  s = s.replace(new RegExp('^(' + c.name + '|' + o.name + ')\\s*:\\s*', 'i'), '').replace(/^say\s*[:\-]\s*/i, '').replace(/[*_#`]/g, '').replace(/^["'“”]+|["'“”]+$/g, '').trim();
  if (s.length > 160) { const cut = s.slice(0, 160); const end = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? ')); s = end > 40 ? cut.slice(0, end + 1) : cut.trim() + '…'; }
  return s || 'Hmm.';
}
function parse(txt, c, o) {
  const g = (txt.match(/go\s*[:\-]\s*([^\n]*)/i) || [])[1];
  const d = (txt.match(/do\s*[:\-]\s*([^\n]*)/i) || [])[1] || '';
  const s = (txt.match(/say\s*[:\-]\s*([\s\S]*)/i) || [])[1];
  const place = g !== undefined ? findPlace(g) : findPlace(txt);
  const action = ACTIONS.find(a => d.toLowerCase().includes(a)) || 'none';
  return { place: place ? place.key : null, action, say: cleanSay(s !== undefined ? s : txt, c, o) };
}
async function aiDecide(c, o) {
  const r = await c.engine.chat.completions.create({ model: c.modelId, messages: buildMsgs(c, o), max_tokens: 80, temperature: 0.85, top_p: 0.9 });
  const txt = r.choices?.[0]?.message?.content || '';
  const p = parse(txt, c, o); p.raw = txt; return p;
}
const LINES = [
  ['Ooh, what does this button do?', 'Do you think the radio knows any new songs?', 'I counted the books. Twice. Different answers!', 'Dance with me, Moss!', 'Is the moon following us?', "What's your favourite sound?", 'I feel extra bouncy tonight.'],
  ['The fern looks perky today.', 'Mm. Quiet is underrated.', "I'll be by the books if you need me.", "You're very bouncy this evening, Pip.", 'Tea would be nice.', "Clear sky tonight. That's a good sign.", 'Sit for a moment. The room will wait.']
];
function scriptDecide(c, o) {
  const ev = events.find(e => e.left > 0); if (ev) ev.left--;
  const move = Math.random() < 0.6;
  const others = PLACES.filter(p => p !== c.place);
  const place = move ? others[(Math.random() * others.length) | 0].key : null;
  const action = Math.random() < 0.55 ? ACTIONS[(Math.random() * 4) | 0] : 'none';
  const line = ev ? `Did you see that, ${o.name}? ${ev.text.replace(/\.$/, '')}!` : LINES[c.i][(Math.random() * LINES[c.i].length) | 0];
  return { place, action, say: line, scripted: true };
}
function apply(c, res) {
  const p = res.place ? byKey(res.place) : null;
  res.moved = !!(p && p !== c.place);
  if (res.moved) { c.place = p; c.target = spot(c, p); c.sitting = false; c.baseY = 0; c.pendingAct = res.action; c.action = 'none'; }
  else { c.pendingAct = res.action; arrive(c); }
  say(c, res.say);
  transcript.push({ who: c.name, text: res.say }); if (transcript.length > 30) transcript.shift();
  logEntry(c, res);
}
function logEntry(c, res) {
  const d = document.createElement('div'); d.className = 'entry'; d.style.setProperty('--c', c.color);
  const b = document.createElement('b'); b.textContent = c.name;
  const m = document.createElement('span'); m.className = 'm'; m.textContent = ' · ' + (res.scripted ? 'scripted' : short(c.modelId));
  const p = document.createElement('div'); p.textContent = res.say;
  const a = document.createElement('div'); a.className = 'act';
  a.textContent = '→ ' + (res.moved ? 'walks to the ' : 'stays at the ') + c.place.label + (res.action !== 'none' ? ' · ' + res.action + 's' : '');
  if (res.raw) d.title = res.raw;
  d.append(b, m, p, a); logEl.prepend(d); while (logEl.children.length > 60) logEl.lastChild.remove();
}
function logNote(text) {
  const d = document.createElement('div'); d.className = 'entry'; const b = document.createElement('b'); b.textContent = '✦ ';
  const s = document.createElement('span'); s.textContent = text; d.append(b, s); logEl.prepend(d);
}

/* ---------- Loop ---------- */
let running = false, busy = false, turn = 0, mode = null, loadedKey = '';
const pauseBtn = $('#pause');
async function loop() {
  if (busy) return; busy = true;
  while (running) {
    const c = chars[turn % 2], o = chars[(turn + 1) % 2];
    thinking(c, true);
    let res;
    if (mode === 'ai' && c.engine) {
      try { res = await aiDecide(c, o); }
      catch (e) { console.error(e); toast(`${c.name}'s model hiccupped, so this turn is scripted`); res = scriptDecide(c, o); }
    } else { await sleep(500); res = scriptDecide(c, o); }
    thinking(c, false);
    apply(c, res); turn++;
    const t0 = performance.now(); while (c.target && performance.now() - t0 < 8000) await sleep(100);
    await sleep(+$('#spd').value);
  }
  busy = false;
}
function begin(m) {
  mode = m; running = true; pauseBtn.disabled = false; pauseBtn.textContent = 'Pause';
  for (const c of chars) c.tag.textContent = c.name + ' · ' + (m === 'ai' ? short(c.modelId) : 'scripted');
  logNote(m === 'ai' ? `AI mode: Pip runs ${short(chars[0].modelId)}, Moss runs ${short(chars[1].modelId)}` : 'Scripted demo (no AI)');
  loop();
}
pauseBtn.onclick = () => {
  running = !running; pauseBtn.textContent = running ? 'Pause' : 'Resume';
  toast(running ? 'Resumed' : 'Paused after this turn'); if (running) loop();
};
$('#demo').onclick = () => { toast('Scripted demo running, no AI needed'); begin('script'); };

/* ---------- WebLLM ---------- */
let webllm = null;
const selA = $('#mA'), selB = $('#mB'), goBtn = $('#go');
function fillEmpty(t) { for (const s of [selA, selB]) { s.innerHTML = ''; const op = document.createElement('option'); op.value = ''; op.textContent = t; s.append(op); } }
async function initAI() {
  let gpuOK = false, f16 = false;
  status('Checking for WebGPU…');
  try { if (navigator.gpu) { const ad = await navigator.gpu.requestAdapter(); if (ad) { gpuOK = true; f16 = ad.features.has('shader-f16'); } } } catch {}
  if (!gpuOK) { fillEmpty('WebGPU not available'); status("This browser has no WebGPU, so the AI models can't run here. Try Chrome on Android or desktop. The scripted demo still works."); return; }
  status('Loading the WebLLM library…');
  try { webllm = await import('https://esm.run/@mlc-ai/web-llm'); }
  catch (e) { console.error(e); fillEmpty('Library failed to load'); status("Couldn't load WebLLM from the CDN. Check your connection and reload."); toast('WebLLM library failed to load'); return; }
  const list = webllm.prebuiltAppConfig.model_list
    .filter(m => !m.model_type && !/embed/i.test(m.model_id) && (m.vram_required_MB || 1e9) <= 4000 && (f16 || !/f16/.test(m.model_id)))
    .sort((a, b) => (a.vram_required_MB || 0) - (b.vram_required_MB || 0));
  if (!list.length) { fillEmpty('No small models found'); status('No small models were found in the WebLLM catalogue.'); return; }
  for (const s of [selA, selB]) {
    s.innerHTML = '';
    for (const m of list) { const op = document.createElement('option'); op.value = m.model_id; op.textContent = `${short(m.model_id)} · ${Math.round(m.vram_required_MB)} MB`; s.append(op); }
  }
  const ids = list.map(m => m.model_id);
  const pick = (prefs, not) => { for (const p of prefs) { const id = ids.find(i => i.startsWith(p) && i !== not); if (id) return id; } return ids.find(i => i !== not) || ids[0]; };
  const savedA = store.get('mA', ''), savedB = store.get('mB', '');
  selA.value = ids.includes(savedA) ? savedA : pick(['SmolLM2-360M-Instruct', 'Qwen2.5-0.5B-Instruct', 'TinyLlama'], '');
  selB.value = ids.includes(savedB) && savedB !== selA.value ? savedB : pick(['Qwen2.5-0.5B-Instruct', 'Llama-3.2-1B-Instruct', 'Qwen3-0.6B', 'gemma'], selA.value);
  goBtn.disabled = false;
  status(`${list.length} free models available. The first start downloads both (sizes shown) and caches them on this device, so later visits load fast and work offline.`);
}
async function unloadAll() {
  const seen = new Set();
  for (const c of chars) if (c.engine && !seen.has(c.engine)) { seen.add(c.engine); try { await c.engine.unload(); } catch {} }
  for (const c of chars) c.engine = null;
}
goBtn.onclick = async () => {
  const a = selA.value, b = selB.value;
  if (!webllm || !a || !b) { toast("AI models aren't available here. Try the scripted demo."); return; }
  if (a === b) { toast('Pick two different models so each character has its own mind'); return; }
  store.set('mA', a); store.set('mB', b);
  if (loadedKey !== a + '|' + b) {
    running = false; goBtn.disabled = selA.disabled = selB.disabled = true; bar(0);
    await unloadAll();
    const cb = r => { bar(r.progress); status(r.text); };
    try {
      const eng = await webllm.CreateMLCEngine([a, b], { initProgressCallback: cb });
      chars[0].engine = chars[1].engine = eng;
    } catch (e) {
      console.warn('Combined load failed, trying one engine per model', e);
      try {
        chars[0].engine = await webllm.CreateMLCEngine(a, { initProgressCallback: cb });
        chars[1].engine = await webllm.CreateMLCEngine(b, { initProgressCallback: cb });
      } catch (e2) {
        console.error(e2); await unloadAll();
        status('Model load failed: ' + (e2.message || e2)); toast('Could not load the models. Try smaller ones.');
        goBtn.disabled = selA.disabled = selB.disabled = false; progEl.style.display = 'none'; return;
      }
    }
    chars[0].modelId = a; chars[1].modelId = b; loadedKey = a + '|' + b;
    goBtn.disabled = selA.disabled = selB.disabled = false; progEl.style.display = 'none';
    status('Both minds loaded. Tap the scene and drag to look around.');
  }
  toast('Two minds, one room. Here we go!'); begin('ai');
};

/* ---------- Nudges & personalities ---------- */
$('#nudge').addEventListener('submit', e => {
  e.preventDefault(); const inp = $('#ev'); const t = inp.value.trim();
  if (!t) { toast('Type something to happen first'); return; }
  events.push({ text: t, left: 2 }); logNote('Event: ' + t); inp.value = '';
  toast(running ? 'Both characters will notice that' : 'Saved. Press Start so they can react');
});
const pA = $('#pA'), pB = $('#pB'); pA.value = chars[0].persona; pB.value = chars[1].persona;
pA.addEventListener('change', () => { chars[0].persona = pA.value.trim() || DEF_A; store.set('pA', chars[0].persona); toast("Pip's personality updated"); });
pB.addEventListener('change', () => { chars[1].persona = pB.value.trim() || DEF_B; store.set('pB', chars[1].persona); toast("Moss's personality updated"); });

initAI();
</script>
</body>
